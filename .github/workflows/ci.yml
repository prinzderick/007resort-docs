name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Intentionally no `branches:` filter: this repo stacks feature branches
    # (e.g. a PR into docs/phase0-architecture before that itself merges to
    # main), and CI must run on those too, not just PRs targeting main.

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint OpenAPI contract
        run: npx -y @redocly/cli@latest lint api/openapi/v1.yaml

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
